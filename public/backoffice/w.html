<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Genişlik</title>
<style>body{margin:0;padding:8px;background:#ccc;font:13px sans-serif}#lb{height:20px}.row{display:flex;gap:16px;align-items:flex-start}iframe{border:0;background:#fff;height:840px}</style>
<div id="lb"></div><pre id="out" style="white-space:pre-wrap;font:11px monospace;margin:0"></pre>
<div class="row"><iframe aria-hidden="true" id="a" style="width:360px"></iframe><iframe aria-hidden="true" id="b" style="width:390px"></iframe><iframe aria-hidden="true" id="c" style="width:430px"></iframe></div>
<script>
var V='overview approvals onboarding clients orders movements redemption treasury stock assets rebalance recon rprice rtrades rmetal rnet rvault rdeliv rdocs rconn rset cases alerts lists freezes staffdeal complaints risk governance calendar whistle reports params users roles integrations modes audit'.split(' ');
var i=Math.max(0,V.indexOf((location.hash||'#overview').slice(1).split('/')[0])),F=['a','b','c'].map(function(x){return document.getElementById(x);}),tb=0;
var bust='./?v='+Date.now();
function each(f){F.forEach(function(fr){try{f(fr.contentWindow,fr.contentDocument);}catch(e){}});}
function show(){tb=0;document.getElementById('lb').textContent=(i+1)+'/'+V.length+' '+V[i];each(function(w){w.location.hash=V[i];});}
F.forEach(function(fr){fr.src=bust+'#'+V[i];});document.getElementById('lb').textContent=(i+1)+'/'+V.length+' '+V[i];
function clk(sel,k){each(function(w,d){var el=d.querySelectorAll(sel)[k||0];if(el)el.click();});}

function desc(el){var c=(el.className&&el.className.baseVal===undefined?el.className:'')||'';return el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+(c?'.'+String(c).trim().split(/\s+/).join('.'):'')+' "'+(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,40)+'"';}
function scrollAnc(el,stop){for(var p=el.parentElement;p&&p!==stop&&p.tagName!=='BODY';p=p.parentElement){var cs=p.ownerDocument.defaultView.getComputedStyle(p);if(/(auto|scroll)/.test(cs.overflowX))return true;}return false;}
function aud(w,d,scope,tag,out){if(!scope)return;var W=d.documentElement.clientWidth,seen={};
 if(d.documentElement.scrollWidth>W+1)out.push(tag+' DOC-X '+d.documentElement.scrollWidth+'>'+W);
 var stop=scope.matches('.panel')?scope.querySelector('.pnb'):scope;[scope,stop].forEach(function(z){if(z&&z.scrollWidth>z.clientWidth+1)out.push(tag+' SCROLL-X '+z.scrollWidth+'>'+z.clientWidth+' '+desc(z).slice(0,30));});var all=scope.querySelectorAll('*');
 for(var n=0;n<all.length;n++){var el=all[n],r=el.getBoundingClientRect();if(!r.width||!r.height)continue;var cs=w.getComputedStyle(el);if(cs.visibility==='hidden')continue;
  if((r.right>W+1||r.left<-1)&&!scrollAnc(el,stop)){var k='O'+desc(el);if(!seen[k]){seen[k]=1;out.push(tag+' OVER '+Math.round(r.left)+'..'+Math.round(r.right)+' '+desc(el));}}
  if(cs.overflowX==='hidden'&&cs.textOverflow!=='ellipsis'&&el.scrollWidth>el.clientWidth+2&&el.children.length<3){var k2='C'+desc(el);if(!seen[k2]){seen[k2]=1;out.push(tag+' CLIP '+el.scrollWidth+'>'+el.clientWidth+' '+desc(el));}}
  if(el.matches('button,a[href],select,input,.tab,[data-act]')&&!scrollAnc(el,stop)||el.matches('.tab,button')){if(r.height<32||r.width<28){var k3='T'+el.tagName+el.className;if(!seen[k3]){seen[k3]=1;out.push(tag+' TAP '+Math.round(r.width)+'x'+Math.round(r.height)+' '+desc(el));}}}
 }}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function runAll(only){var out=[],o=document.getElementById('out');o.textContent='running';
 for(var vi=0;vi<V.length;vi++){if(only&&V[vi]!==only)continue;each(function(w){w.location.hash=V[vi];});await sleep(350);
  F.forEach(function(fr){var w=fr.contentWindow,d=fr.contentDocument;aud(w,d,d.querySelector('.content'),fr.style.width+' '+V[vi],out);aud(w,d,d.querySelector('.top'),fr.style.width+' '+V[vi]+' top',out);});
  each(function(w,d){var el=d.querySelector('.content tr[data-t], .content .li.click, .content [data-act="openAp"]');if(el)el.click();});await sleep(400);
  F.forEach(function(fr){var w=fr.contentWindow,d=fr.contentDocument;aud(w,d,d.querySelector('.panel.on'),fr.style.width+' '+V[vi]+' panel',out);});
  each(function(w,d){var b=d.querySelector('.panel.on .x');if(b)b.click();});await sleep(250);
  o.textContent='running '+vi+' issues '+out.length;}
 o.textContent='AUDIT DONE '+out.length+'\n'+out.join('\n');}
function noSb(){each(function(w,d){if(!d.getElementById('nosb')){var s=d.createElement('style');s.id='nosb';s.textContent='::-webkit-scrollbar{width:0!important;height:0!important}*{scrollbar-width:none!important}';d.head.appendChild(s);}});}
F.forEach(function(fr){fr.addEventListener('load',function(){setTimeout(noSb,300);});});
document.addEventListener('keydown',function(e){var k=e.key;
 if(k==='ArrowRight'){i=(i+1)%V.length;show();}
 else if(k==='ArrowLeft'){i=(i-1+V.length)%V.length;show();}
 else if(k==='j'){each(function(w,d){var c=d.querySelector('.panel.on .pnb')||d.querySelector('.content');if(c)c.scrollTop+=700;});}
 else if(k==='k'){each(function(w,d){var c=d.querySelector('.panel.on .pnb')||d.querySelector('.content');if(c)c.scrollTop=0;});}
 else if(k==='p'){clk('.content tr[data-t], .content .li.click, .content [data-act="openAp"]');}
 else if(k==='x'){each(function(w,d){var b=d.querySelector('.panel.on .x');if(b)b.click();});}
 else if(k==='t'){tb++;each(function(w,d){var t=d.querySelectorAll('.content .tabs .tab');if(t.length)t[tb%t.length].click();});}
 else if(k==='m'){clk('#burger');}
 else if(k==='u'){clk('#who');}
 else if(k==='b'){each(function(w,d){var b=[...d.querySelectorAll('.content .ph .acts .btn, .content .acts .btn')].find(function(x){return !x.disabled;});if(b)b.click();});}
 else if(k==='a'){runAll();}
 else if(k==='A'){runAll(V[i]);}
 else if(k==='e'){each(function(w,d){var b=d.querySelector('[data-act="ddLang"][data-k="en"]');if(!b){d.querySelector('#who').click();b=d.querySelector('[data-act="ddLang"][data-k="en"]');}if(b)b.click();});}
});
</script>
</html>
