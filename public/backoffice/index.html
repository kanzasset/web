<!doctype html>
<html lang="tr">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanzasset Backoffice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: Kanzasset Backoffice frame. White 240px menu with red accents, 64px top bar, page content, detail opens as a panel from the right. */
:root{
  --red:#D4202B; --red-deep:#A8161F; --red-soft:rgba(212,32,43,.08);
  --ink:#0A0A0A; --muted:#7A7A7E; --muted2:#A8A8AB;
  --line:#ECECEA; --line2:#E0E0DD;
  --surface:#F7F7F4; --surface2:#FBFBF9; --card:#FFFFFF; --side:#FFFFFF;
  --sel:#ECECEA; --pos:#0F7A47; --pos-soft:rgba(15,122,71,.10);
  --warn:#B7791F; --warn-soft:rgba(183,121,31,.12);
  --info:#2F5D8A; --info-soft:rgba(47,93,138,.10);
  --neg-soft:rgba(212,32,43,.10);
  --shadow:0 18px 50px rgba(10,10,10,.14);
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#E5484D; --red-deep:#C93A40; --red-soft:rgba(229,72,77,.14);
  --ink:#EDEDEA; --muted:#9A9A9E; --muted2:#6E6E72;
  --line:#26262A; --line2:#303034; --surface:#111113; --surface2:#151518; --card:#18181B; --side:#141416;
  --sel:#232327; --pos:#3DBF7F; --pos-soft:rgba(61,191,127,.14); --warn:#E0A84A; --warn-soft:rgba(224,168,74,.14);
  --info:#7FA8D6; --info-soft:rgba(127,168,214,.14); --neg-soft:rgba(229,72,77,.16); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#E5484D; --red-deep:#C93A40; --red-soft:rgba(229,72,77,.14);
  --ink:#EDEDEA; --muted:#9A9A9E; --muted2:#6E6E72;
  --line:#26262A; --line2:#303034; --surface:#111113; --surface2:#151518; --card:#18181B; --side:#141416;
  --sel:#232327; --pos:#3DBF7F; --pos-soft:rgba(61,191,127,.14); --warn:#E0A84A; --warn-soft:rgba(224,168,74,.14);
  --info:#7FA8D6; --info-soft:rgba(127,168,214,.14); --neg-soft:rgba(229,72,77,.16); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);flex:none}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.brand b{font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand .bo{font-size:10px;font-weight:800;color:#fff;background:var(--red);border-radius:5px;padding:2px 6px;letter-spacing:.06em}
.nav{overflow-y:auto;padding:10px 12px 24px;flex:1}
.ng{margin-top:14px}
.ng>.gl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);padding:0 12px 6px}
.ni{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.ni:hover{background:var(--surface2);color:var(--ink)}
.ni.on{background:var(--sel);color:var(--ink);font-weight:700}
.ni .ct{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px}
.ni:focus-visible,.btn:focus-visible,.tab:focus-visible,tr[data-t]:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:64px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.burger{display:none;border:1px solid var(--line2);background:var(--card);border-radius:8px;width:36px;height:36px;cursor:pointer}
.crumb{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumb small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.crumb b{font-size:15px;font-weight:800}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--card)}
.viewas{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;flex:none}
.viewas select{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:6px 8px;font-weight:700;font-size:12.5px;max-width:200px}
.bell{position:relative;border:1px solid var(--line2);background:var(--card);border-radius:9px;height:34px;padding:0 10px;cursor:pointer;font-weight:700;font-size:12px;flex:none}
.bell i{font-style:normal;position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:1px 6px}
.content{flex:1;overflow-y:auto;min-height:0}
.page{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px}
@media (min-width:900px){.page{padding-left:32px;padding-right:32px}}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:18px}
.ph .t{min-width:0;flex:1 1 320px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 4px;text-wrap:balance}
.lead{color:var(--muted);max-width:78ch;margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:0 14px;height:36px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted2)}
.btn.pri{background:linear-gradient(180deg,var(--red),var(--red-deep));border-color:var(--red-deep);color:#fff}
.btn.ghost{background:none}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.kpi .l{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.alert{border-color:var(--red)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:6px}
.bar.w>i{background:var(--warn)} .bar.r>i{background:var(--red)} .bar.g>i{background:var(--pos)}
.sec{margin-top:18px}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.sh h2{font-size:14.5px;font-weight:800;margin:0}
.sh .n{font-size:12px;color:var(--muted)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.tw{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr[data-t]{cursor:pointer} tr[data-t]:hover td{background:var(--surface2)}
td .sub{display:block;font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--sel);color:var(--ink)}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neg{background:var(--neg-soft);color:var(--red)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.ink{background:var(--ink);color:var(--card)} .pill.out{background:none;border:1px solid var(--line2);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{border:0;background:none;padding:8px 12px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.tab .c{font-size:10.5px;margin-left:5px;color:var(--muted)}
.note{border:1px solid var(--line);border-left:3px solid var(--info);background:var(--card);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink)}
.note.fix{border-left-color:var(--pos)} .note.warn{border-left-color:var(--warn)} .note.red{border-left-color:var(--red)}
.note b{font-weight:800}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.flow .st{border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-weight:700;background:var(--surface2)}
.flow .st.done{border-color:var(--pos);color:var(--pos);background:var(--pos-soft)}
.flow .st.cur{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.flow .ar{color:var(--muted2)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:default}
.li.click{cursor:pointer} .li.click:hover{border-color:var(--muted2)}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:13px}
.li .m span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em}
/* panel */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.28);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.on{transform:none}
.pnh{display:flex;gap:10px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.pnh .t{flex:1;min-width:0}
.pnh h3{margin:2px 0 0;font-size:17px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.x{border:1px solid var(--line2);background:var(--card);border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none;font-size:16px}
.pnb{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.pnf{border-top:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pnf .why{font-size:12px;color:var(--muted);flex-basis:100%}
.blk h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.steps{display:flex;flex-direction:column;gap:8px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--sel);flex:none}
.step.done .n{background:var(--pos);color:#fff} .step.cur{border-color:var(--red)} .step.cur .n{background:var(--red);color:#fff}
.step .m{flex:1;min-width:0;font-size:12.5px} .step .m b{display:block}
.confirm{border:1px solid var(--red);background:var(--red-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
textarea,input[type=text],input[type=number]{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:8px 10px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:700;font-size:12.5px;opacity:0;transition:.2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:12.5px}
.switch input{display:none} .switch i{width:34px;height:20px;border-radius:20px;background:var(--line2);position:relative;transition:.15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+i{background:var(--red)} .switch input:checked+i:after{left:16px}
.mode-on{background:var(--red);color:#fff;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));font-weight:700;font-size:12.5px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:260px;z-index:45;transform:translateX(-102%);transition:transform .2s}
  .side.on{transform:none;box-shadow:var(--shadow)}
  .burger{display:inline-grid;place-items:center}
  .gsearch{display:none}
}
@media (max-width:560px){ .bell b{display:none} .who .nm{display:none} #lang{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2 additions */
.gsearch{position:relative;flex:0 1 360px;min-width:160px}
.gsearch input{width:100%;height:36px;border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:0 12px 0 32px}
.gsearch:before{content:"⌕";position:absolute;left:11px;top:7px;color:var(--muted);font-size:16px}
.gres{position:absolute;top:42px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;max-height:380px;overflow:auto;padding:6px}
.gres button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.gres button:hover,.gres button:focus{background:var(--surface2)}
.gres small{display:block;color:var(--muted);font-size:11.5px}
.gres .gh{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);padding:6px 10px 2px}
.ibtn{border:1px solid var(--line2);background:var(--card);border-radius:9px;height:34px;min-width:34px;padding:0 8px;cursor:pointer;font-weight:700;font-size:13px;flex:none}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;flex:none;max-width:240px}
.who .nm{display:flex;flex-direction:column;line-height:1.15;text-align:left;min-width:0}
.who .nm b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .nm small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.av.lg{width:56px;height:56px;font-size:19px}
.dd{position:fixed;top:60px;right:max(12px,env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:35;padding:8px;display:none}
.dd.on{display:block}
.dd .hd{display:flex;gap:10px;align-items:center;padding:8px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dd .it{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600;text-align:left}
.dd .it:hover{background:var(--surface2)}
.dd .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px}
.dd .row span{font-weight:600}
.seg.sm button{padding:4px 8px;font-size:11.5px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tb input[type=search],.tb input[type=date],.tb select{height:34px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:0 10px;font-size:12.5px}
.tb input[type=search]{flex:1 1 220px;min-width:160px}
.tb .cnt{font-size:12px;color:var(--muted);margin-left:auto}
.pg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted)}
.pg select{height:30px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:0 6px}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .e{position:relative;padding:0 0 12px 16px;font-size:12.5px}
.tl .e:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line2)}
.tl .e.ok:before{background:var(--pos)} .tl .e.cur:before{background:var(--red)} .tl .e.wait:before{background:var(--card);border:2px solid var(--line2);box-sizing:border-box}
.tl .e small{display:block;color:var(--muted);font-size:11.5px}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.leg{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.leg h4{margin:0 0 4px;font-size:13px;font-weight:800}
.leg .muted{font-size:12px}
.gauge{position:relative;height:34px;margin:10px 0 4px}
.gauge .trk{position:absolute;left:0;right:0;top:13px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--neg-soft),var(--line) 47%,var(--line) 53%,var(--warn-soft))}
.gauge .mk{position:absolute;top:6px;width:2px;height:22px;background:var(--muted2)}
.gauge .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.gauge .pt{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--red);border:3px solid var(--card);box-shadow:0 0 0 1px var(--red)}
.paper{background:#fff;color:#111;border:1px solid #ddd;border-radius:6px;padding:22px;font-size:12px}
.paper h5{font-size:15px;margin:0 0 2px;letter-spacing:.04em}
.paper .pr{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.paper .pr div{font-size:11.5px;line-height:1.5}
.paper table{min-width:0;font-size:11.5px} .paper th{background:#f4f4f2;color:#555} .paper td{color:#111}
.paper .ft{margin-top:12px;color:#666;font-size:11px}
.login{position:fixed;inset:0;background:var(--surface);z-index:80;display:grid;place-items:center;padding:24px;overflow:auto}
.login .box{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.login .acc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;cursor:pointer;margin-bottom:6px}

.login .accs{max-height:44vh;overflow:auto;margin:12px 0}
.code{display:flex;gap:6px;justify-content:center;margin:14px 0}
.code input{width:42px;height:48px;text-align:center;font-family:var(--mono);font-size:20px;border:1px solid var(--line2);border-radius:10px;background:var(--card)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:8px 10px;font-weight:500;color:var(--ink);width:100%}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:12.5px;color:var(--ink)}
.chk input{width:auto}
.ptabs{position:sticky;top:0;background:var(--surface);z-index:5;padding-top:4px}
.cl-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px}
.cl-head .t{flex:1 1 280px;min-width:0}
.back{border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer;padding:0;margin-bottom:6px}
.rm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:6px}
.lock{opacity:.5}

/* Round 4: closer to the Kanzasset Backoffice template (KZ Backoffice v3) */
#themeBtn,#lang{display:none!important}
.brand{gap:9px;padding:0 14px 0 18px}
.brand .logo{height:26px;width:auto;display:block;object-fit:contain;flex:none}
.brand b{font-size:16px;letter-spacing:-.02em}
.brand .bo{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--red);background:var(--red-soft);padding:2px 6px;border-radius:4px;letter-spacing:.06em}

.sg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;margin:0 4px 3px 0;color:var(--muted);white-space:nowrap}

.cov .track i{display:block;height:100%;border-radius:4px;background:var(--pos)}
.cov .track i.w{background:var(--warn)}
.cov b{font-family:var(--mono);font-size:14px}
.box2{padding:12px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
.box2 .k{font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase}
.box2 .x{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:5px}
.box2 .y{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.stage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 12px}

.stage>div b{display:block;font-size:12.5px}
.stage>div.ok{border-color:var(--pos);background:var(--pos-soft)}

.stage>div.no{border-color:var(--red);background:var(--neg-soft)}

.acclist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;cursor:pointer;margin-bottom:6px}

// List with search, filters, date range, sort and paging (refinery Spec 10A list tools).
function list(id,cfg){
  const st=S.lists[id]||(S.lists[id]={q:'',f:{},pg:1,sz:cfg.size||25,sort:cfg.sort||null,dir:cfg.dir||-1,from:'',to:''});
  let rows=cfg.rows;
  const q=st.q.trim().toLowerCase();
  if(q&&cfg.search)rows=rows.filter(r=>cfg.search(r).toLowerCase().includes(q));
  (cfg.filters||[]).forEach(f=>{const v=st.f[f.k];if(v&&v!=='all')rows=rows.filter(r=>String(f.get(r))===v);});
  if(cfg.date){if(st.from)rows=rows.filter(r=>cfg.date(r)>=st.from);if(st.to)rows=rows.filter(r=>cfg.date(r)<=st.to);}
  if(st.sort){const c=cfg.cols.find(c=>c.sk===st.sort);if(c){rows=rows.slice().sort((a,b)=>{const x=c.sv(a),y=c.sv(b);return (x>y?1:x<y?-1:0)*st.dir;});}}
  const total=rows.length,pages=Math.max(1,Math.ceil(total/st.sz));if(st.pg>pages)st.pg=pages;
  const view=rows.slice((st.pg-1)*st.sz,st.pg*st.sz);
  const tid='t'+(tblSeq++);TBL[tid]={rows:view,onRow:cfg.onRow};
  const tb=`<div class="tb">${cfg.search?`<input type="search" id="lq-${id}" data-list="${id}" data-lk="q" value="${esc(st.q)}" placeholder="${esc(T(cfg.ph||['Ara','Search']))}">`:''}${
    (cfg.filters||[]).map(f=>`<select data-list="${id}" data-lk="f" data-fk="${f.k}" aria-label="${esc(T(f.l))}"><option value="all">${esc(T(f.l))}: ${L('Tümü','All')}</option>${f.opts.map(([v,l])=>`<option value="${esc(v)}" ${st.f[f.k]===v?'selected':''}>${esc(T(l))}</option>`).join('')}</select>`).join('')}${
    cfg.date?`<input type="date" data-list="${id}" data-lk="from" value="${st.from}" aria-label="${L('Başlangıç','From')}"><input type="date" data-list="${id}" data-lk="to" value="${st.to}" aria-label="${L('Bitiş','To')}">`:''}${
    (st.q||Object.values(st.f).some(v=>v&&v!=='all')||st.from||st.to)?btn(['Temizle','Clear'],'listClr',`data-id="${id}"`,'sm ghost'):''}<span class="cnt">${n(total)} ${L('kayıt','records')}</span>${cfg.tools||''}</div>`;
  const body=!view.length?`<div class="card muted">${esc(T(cfg.empty||['Bu filtreyle kayıt yok.','No records match.']))}</div>`:
   `<div class="tw"><table><thead><tr>${cfg.cols.map(c=>`<th class="${c.num?'num':''} ${c.sk?'sort':''}" ${c.sk?`data-act="listSort" data-id="${id}" data-k="${c.sk}"`:''}>${esc(T(c.l))}${c.sk&&st.sort===c.sk?(st.dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${
   view.map((r,i)=>`<tr ${cfg.onRow?`data-t="${tid}" data-i="${i}" tabindex="0"`:''}>${cfg.cols.map(c=>`<td class="${c.num?'num':''}">${c.f?c.f(r):esc(T(r[c.k]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const pg=total>Math.min(...[10,25,50,100].filter(x=>x>=0))||pages>1?`<div class="pg"><span>${L('Sayfa başına','Per page')}</span><select data-list="${id}" data-lk="sz">${[10,25,50,100].map(x=>`<option ${x===st.sz?'selected':''}>${x}</option>`).join('')}</select><span>${L('Sayfa','Page')} ${st.pg} / ${pages}</span>${btn(['Önceki','Previous'],'listPg',`data-id="${id}" data-d="-1" ${st.pg<=1?'disabled':''}`,'sm')}${btn(['Sonraki','Next'],'listPg',`data-id="${id}" data-d="1" ${st.pg>=pages?'disabled':''}`,'sm')}</div>`:'';
  return tb+body+pg;
}

function curStep(a){return a.steps.findIndex(s=>s.signed.length<s.n);}
function stepRoles(s){return s.roles.map(r=>roleName(r)).join(' / ');}
function signReason(a){
  const u=me();if(!u)return['Oturum yok.','Not signed in.'];
  if(a.status!=='open')return['Karar verildi.','Already decided.'];
  if(isRO())return['İç denetim salt okunur erişime sahiptir.','Internal audit has read-only access.'];
  const i=curStep(a);const s=a.steps[i];
  if(u.id===a.iu)return['Hazırlayan kendi kaydını onaylayamaz (dört göz).','The initiator cannot approve their own record (four eyes).'];
  if(a.steps.some(st=>st.signed.some(x=>x.u===u.id)))return['Bu kayda zaten imza attınız; aynı kişi iki adımı onaylayamaz.','You already signed this record; one person cannot approve two steps.'];
  if(s.not&&u.roles.some(r=>s.not.includes(r)))return[`Bu adımı ${s.not.map(roleName).join(', ')} onaylayamaz (operasyonel yeter sayı dışından ikinci kişi gerekir).`,`${s.not.map(roleName).join(', ')} cannot approve this step (the second person must be outside the operational quorum).`];
  const ok=u.roles.some(r=>s.roles.includes(r))||(s.roles.includes('AP')&&u.ap);
  if(!ok)return[`Bu adım şunu bekliyor: ${stepRoles(s)}.`,`This step waits for: ${stepRoles(s)}.`];
  return null;
}
const canSign=a=>!signReason(a);
function sign(a){
  const r=signReason(a);if(r){toast(r);return;}
  const i=curStep(a);a.steps[i].signed.push({u:me().id,role:me().roles[0],t:L('şimdi','now')});
  audit(`${a.mc} ${T(a.steps[i].l)} · ${L('onay','approved')}`,a.id);
  if(curStep(a)===-1){a.status='done';a.decided=L('şimdi','now');if(a.done&&EFFECTS[a.done])EFFECTS[a.done](a);toast(['Onaylandı, işlem tamamlandı.','Approved. The action is complete.']);}
  else{const nx=a.steps[curStep(a)];toast([`Onaylandı. Sıradaki: ${T(WHERE[nx.where])}`,`Approved. Next: ${T(WHERE[nx.where])}`]);}
  rerender();
}
function reject(a,why){a.status='rejected';a.why=why||'';a.decided=L('şimdi','now');audit(`${a.mc} ${L('reddedildi','rejected')}: ${why}`,a.id);if(a.onReject&&EFFECTS[a.onReject])EFFECTS[a.onReject](a);toast(['Reddedildi, gerekçe kaydedildi.','Rejected. The reason is recorded.']);rerender();}
let apSeq=1060;
function newApproval(t,silent){

  const a=Object.assign({id:'APR-'+(apSeq++),iu:S.uid,created:L('şimdi','now'),status:'open'},t);
  a.steps=a.steps.map(s=>Object.assign({signed:[]},s));
  APPROVALS.unshift(a);audit(`${a.mc} ${T(a.kind)} · ${L('talep açıldı','request opened')}`,a.id);
  if(!silent){toast([`${a.id} onaya gönderildi.`,`${a.id} sent for approval.`]);rerender();openApproval(a.id);}return a;
}

      else{foot=`${btn(ext?EXTBTN[s.where]:['Onayla','Approve'],'apSign',`data-id="${a.id}" ${why?'disabled':''}`,'pri')}${btn(['Reddet','Reject'],'apReject',`data-id="${a.id}" ${why?'disabled':''}`,'danger')}${why?`<div class="why">${esc(T(why))}</div>`:''}`;}
    } else foot=`<div class="why">${a.status==='done'?L('Tamamlandı','Completed'):L('Reddedildi: ','Rejected: ')+esc(a.why||'')} · ${esc(a.decided||'')}</div>`;

  });
}

function metalDays(){const days=[];let close=B.metal;
 for(let d=17;d>=4;d--){const tr=RTRADES.filter(t=>t.day===d&&t.st==='fill'&&!t.t3);const b=tr.filter(t=>t.side==='B').reduce((s,t)=>s+t.g,0),s=tr.filter(t=>t.side==='S').reduce((s2,t)=>s2+t.g,0);
  const vin=VAULT.filter(v=>v.dir==='in'&&v.ac&&(v.ev.find(e=>e[0]==='acc')||[])[1]&&+(v.ev.find(e=>e[0]==='acc')[1]).slice(0,2)===d).reduce((x,v)=>x+v.g,0);
  const open=close-b+s+vin;days.push({d,date:`${String(d).padStart(2,'0')}.11.2026`,open,b,s,vin,close,stm:d<17?'ok':'open',n:tr.length});close=open;}
 return days;}

const inVault=()=>VAULT.filter(v=>v.dir==='in');
const lateSlip=v=>v.dir==='in'&&v.st==='acc'&&!!v.late;
const mintPaused=()=>VAULT.some(lateSlip);
const mintableOf=v=>['acc','placed'].includes(v.st)&&!mintPaused()?Math.max(0,v.g-(v.mq||0)):0;
const placedTotal=()=>Math.max(0,B.supply+B.awaitMint-allocPending());
const dispatchedTotal=()=>VAULT.filter(v=>v.dir==='out'&&v.pd&&v.st==='exited'&&v.handed===false).reduce((s,v)=>s+v.g,0);
const mintableTotal=()=>inVault().reduce((s,v)=>s+mintableOf(v),0);
const allocPending=()=>inVault().filter(v=>v.st==='acc').reduce((s,v)=>s+v.g,0);
const inApproval=()=>inVault().filter(v=>['cfo','sa','req'].includes(v.st)).reduce((s,v)=>s+v.g,0);
const signingMints=()=>SUPPLY.filter(m=>m.k==='mint'&&m.bg!=='seen'&&!(m.ap&&apOf(m.ap)&&apOf(m.ap).status==='rejected'));
const signingTotal=()=>signingMints().reduce((s,m)=>s+m.g,0);
const signingBurns=()=>SUPPLY.filter(m=>m.k==='burn'&&m.bg!=='seen'&&m.bg!=='hand');
const cap24Left=()=>Math.max(0,CAP24-B.minted24-signingTotal());
function opsRefresh(){OPS.filter(o=>o.dir==='in').forEach(o=>{const v=vaultOf(o.vr);if(!v)return;
 if(['acc','placed'].includes(v.st)){o.st=(v.minted||0)>=v.g?(v.st==='placed'?'done':'place'):(v.mq||0)>=v.g?'sign':'mint';}});}

function createMint(g,basis,op,auto){
 const m={id:'MT-0'+(seqMT++),k:'mint',g,op:op.id,basis,slip:basis.map(b=>b.slip).filter(Boolean).join(', '),ac:[...new Set(basis.map(b=>vaultOf(b.v).ac))].join(', '),auto,trig:auto?'auto':'manual',

 const a=newApproval({mc:'MC-04',kind:['Basım (mint)','Mint'],title:[`${n(g)} AGOLD basımı · ${op.id} · ${m.ac}`,`Mint ${n(g)} AGOLD · ${op.id} · ${m.ac}`],amt:`${n(g)} AGOLD`,done:'mint',qty:g,op:op.id,

  rule:['Basım rafinerinin Tahsis Belgesiyle açılır; mülkiyet bu belgeyle geçer. Kasa giriş fişi 3 kasa iş günü içinde gelir, gecikirse basım durur. İmza BitGo\'da operasyonel yeter sayıyla (CEO, CTO, COO, 3\'te 2).','A mint opens on the Refinery\'s Allocation Certificate; title passes with it. The vault entry slip follows within 3 vault business days; if late, minting stops. Signed in BitGo by the operational quorum (CEO, CTO, COO, 2 of 3).'],
  steps:[S_TPL(['BitGo imzacıları','BitGo signers'],'bitgo',['CEO','CTO','COO'],2)]},true);
 if(!a)return null;if(auto)a.iu='sys';m.ap=a.id;SUPPLY.unshift(m);basis.forEach(b=>{const v=vaultOf(b.v);v.mq=(v.mq||0)+b.g;});if(!op.sup)op.sup=m.id;return m;}
// split g over the allocated or placed vault records, oldest first, in pieces of at most CAP1
function planMints(g,only,auto){const src=inVault().filter(v=>mintableOf(v)>0&&(!only||v.id===only)).reverse();const made=[];let left=g;
 while(left>0){let chunk=Math.min(left,CAP1);const basis=[];let need=chunk;
  for(const v of src){const free=mintableOf(v)-basis.filter(b=>b.v===v.id).reduce((s,b)=>s+b.g,0);if(free<=0)continue;const t=Math.min(free,need);basis.push({v:v.id,g:t,slip:v.slip||'',ac:v.ac});need-=t;if(!need)break;}
  if(need>0)chunk-=need;if(chunk<=0)break;
  const op=opOf(vaultOf(basis[0].v).op);const m=createMint(chunk,basis,op,auto);if(!m)break;made.push(m);left-=chunk;}
 opsRefresh();return made;}
function autoMint(v){const op=opOf(v.op);const want=mintableOf(v);const g=Math.min(want,cap24Left());if(g<=0){op.capWait=true;return [];}
 const prev=S.uid;const made=planMints(g,v.id,true);S.uid=prev;if(g<want)op.capWait=true;return made;}

// ===== m1: mobile layout behaviours =====
// Drawer menu with scrim and scroll lock, search inside the drawer on phones, Escape closes, safe resize.
(function(){
 const MQ=900;
 const isMob=()=>(window.innerWidth||1200)<MQ;
 const side=$('side'),scrim=$('scrim'),panel=$('panel'),root=document.documentElement;
 const sync=()=>{
  const sOn=side.classList.contains('on'),pOn=panel.classList.contains('on');
  if(sOn)scrim.classList.add('on');else if(!pOn)scrim.classList.remove('on');
  if(root&&root.classList)root.classList.toggle('m-lock',isMob()&&(sOn||pOn));
  try{$('burger').setAttribute('aria-expanded',sOn?'true':'false');}catch(e){}
 };
 const openSide=()=>{side.classList.add('on');sync();};
 const closeSide=()=>{side.classList.remove('on');sync();};
 // keep the scrim and scroll lock in step with the drawer and the detail panel, whoever opens or closes them
 try{if(typeof MutationObserver!=='undefined'){const mo=new MutationObserver(sync);mo.observe(side,{attributes:true,attributeFilter:['class']});mo.observe(panel,{attributes:true,attributeFilter:['class']});}}catch(e){}
 $('burger').onclick=()=>{if(!isMob()){toggleMini();return;}side.classList.contains('on')?closeSide():openSide();};
 $('scrim').onclick=()=>{closePanel();closeSide();};
 // a tap on any menu item closes the drawer, also when it is the page already open
 try{$('nav').addEventListener('click',e=>{if(isMob()&&e.target&&e.target.closest&&e.target.closest('.ni'))closeSide();});}catch(e){}
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&side.classList.contains('on'))closeSide();});
 // on phones the search box lives at the top of the drawer
 const gs=document.querySelector?document.querySelector('.gsearch'):null;
 const top=document.querySelector?document.querySelector('.top'):null;
 const placeSearch=()=>{if(!gs||!top||!side.insertBefore)return;
  const brand=side.querySelector('.brand');
  if(isMob()){if(gs.parentNode!==side&&brand)side.insertBefore(gs,brand.nextSibling);}
  else if(gs.parentNode!==top){const ref=$('themeBtn');top.insertBefore(gs,ref);}
 };
 placeSearch();
 let rt=null;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{placeSearch();if(!isMob())side.classList.remove('on');sync();},120);});
 // the selected search result opens a page or a panel: close the drawer too
 const _gsel=ACT.gsel;if(_gsel)ACT.gsel=d=>{closeSide();return _gsel(d);};
 sync();
})();
